name: Flutter Nightly Build

on:
  workflow_dispatch:
    inputs:
      windows-only:
        description: "Compilar únicamente instaladores de Windows (más rápido, ~25 min)"
        required: false
        default: true
        type: boolean
      upload-tag:
        description: "Etiqueta (Release tag) donde publicar los instaladores"
        required: false
        default: "nightly"
        type: string

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ inputs.upload-tag || 'nightly' }}
      windows-only: ${{ inputs.windows-only }}
